<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - MathBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50">
<div class="text-center">
    <p class="text-8xl font-bold text-indigo-600 mb-4">404</p>
    <p class="text-xl font-semibold text-gray-700 mb-2">페이지를 찾을 수 없습니다</p>
    <p class="text-sm text-gray-500 mb-8" th:text="${errorMessage}">요청하신 리소스를 찾을 수 없습니다.</p>
    <a th:href="@{/problem/list}"
       class="px-5 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition-colors text-sm">
        홈으로 돌아가기
    </a>
</div>
</body>
</html>
