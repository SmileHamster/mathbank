<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - MathBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50">
<div class="text-center">
    <p class="text-8xl font-bold text-red-500 mb-4">500</p>
    <p class="text-xl font-semibold text-gray-700 mb-2">서버 오류가 발생했습니다</p>
    <p class="text-sm text-gray-500 mb-8" th:text="${errorMessage}">일시적인 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</p>
    <a th:href="@{/problem/list}"
       class="px-5 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition-colors text-sm">
        홈으로 돌아가기
    </a>
</div>
</body>
</html>
