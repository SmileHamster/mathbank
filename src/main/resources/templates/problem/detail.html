<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${problem.title}">문제 상세</title>
</head>
<body>
<div layout:fragment="content">

    <div class="max-w-3xl space-y-6">

        <!-- 제목 + 태그 -->
        <div>
            <h1 class="text-2xl font-bold text-gray-800 mb-3" th:text="${problem.title}"></h1>
            <div class="flex flex-wrap gap-1.5">
                <span th:each="tag : ${problem.tagList}"
                      th:text="${tag.tagValue}"
                      th:class="${'text-xs px-2.5 py-1 rounded-full ' +
                          (tag.tagType == 'GRADE'      ? 'bg-blue-100 text-blue-700'   :
                          (tag.tagType == 'DIFFICULTY' ? 'bg-red-100 text-red-700'    :
                          (tag.tagType == 'TYPE'       ? 'bg-green-100 text-green-700' :
                                                         'bg-gray-100 text-gray-700')))}">
                </span>
            </div>
        </div>

        <!-- 문제 내용 -->
        <div class="bg-white border border-gray-200 rounded-lg p-5">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">문제</h2>
            <div th:text="${problem.content}"
                 class="text-gray-800 leading-relaxed whitespace-pre-wrap"></div>
        </div>

        <!-- 정답 토글 -->
        <div>
            <button id="toggleAnswer"
                    class="text-sm px-4 py-2 rounded border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors">
                정답 보기
            </button>
            <div id="answerDiv" class="hidden mt-3 p-4 bg-green-50 border border-green-200 rounded-lg">
                <p class="text-xs font-semibold text-green-600 mb-1">정답</p>
                <p th:text="${problem.answer}" class="text-gray-800 whitespace-pre-wrap"></p>
            </div>
        </div>

        <!-- 해설 토글 -->
        <div th:if="${problem.explanation != null and !#strings.isEmpty(problem.explanation)}">
            <button id="toggleExplanation"
                    class="text-sm px-4 py-2 rounded border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors">
                해설 보기
            </button>
            <div id="explanationDiv" class="hidden mt-3 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                <p class="text-xs font-semibold text-blue-600 mb-1">해설</p>
                <div th:text="${problem.explanation}"
                     class="text-gray-800 leading-relaxed whitespace-pre-wrap"></div>
            </div>
        </div>

        <!-- 하단 버튼 -->
        <div class="flex items-center gap-3 pt-2 border-t border-gray-100">
            <a th:href="@{/problem/{id}/edit(id=${problem.id})}"
               class="px-4 py-2 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition-colors">
                수정
            </a>
            <a th:href="@{/problem/list}"
               class="px-4 py-2 bg-white text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors">
                목록으로
            </a>
        </div>

    </div>

</div>
<div layout:fragment="scripts">
<script th:inline="none">
document.addEventListener("DOMContentLoaded", function () {
    function setupToggle(btnId, divId, openText, closeText) {
        const btn = document.getElementById(btnId);
        const div = document.getElementById(divId);
        if (!btn || !div) return;
        btn.addEventListener('click', function () {
            div.classList.toggle('hidden');
            btn.textContent = div.classList.contains('hidden') ? openText : closeText;
        });
    }
    setupToggle('toggleAnswer',      'answerDiv',      '정답 보기',  '정답 닫기');
    setupToggle('toggleExplanation', 'explanationDiv', '해설 보기',  '해설 닫기');
});
</script>
</div>
</body>
</html>
