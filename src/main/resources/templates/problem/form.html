<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${problem != null} ? '문제 수정' : '새 문제 등록'">문제 등록</title>
</head>
<body>
<div layout:fragment="content">

    <div class="max-w-3xl">
        <h1 class="text-xl font-bold text-gray-800 mb-6"
            th:text="${problem != null} ? '문제 수정' : '새 문제 등록'"></h1>

        <!-- 서버측 태그 오류 배너 -->
        <div th:if="${tagError}"
             class="mb-4 px-4 py-3 bg-red-50 border border-red-300 rounded-lg text-sm text-red-700"
             th:text="${tagError}"></div>

        <form th:action="${problem != null} ? @{/problem/{id}/edit(id=${problem.id})} : @{/problem/new}"
              th:object="${form}" method="post" enctype="multipart/form-data" class="space-y-6">

            <!-- 제목 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    제목 <span class="text-red-500">*</span>
                </label>
                <input type="text" th:field="*{title}"
                       th:class="${#fields.hasErrors('title')}
                           ? 'w-full px-3 py-2 border border-red-400 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-red-400'
                           : 'w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400'"/>
                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}"
                   class="mt-1 text-xs text-red-500"></p>
            </div>

            <!-- 문제 내용 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    문제 내용 <span class="text-red-500">*</span>
                </label>
                <textarea id="contentTextarea" th:field="*{content}" rows="6"
                          th:class="${#fields.hasErrors('content')}
                              ? 'w-full px-3 py-2 border border-red-400 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-red-400 font-mono'
                              : 'w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400 font-mono'"></textarea>
                <p class="mt-1 text-xs text-gray-400">수식은 $...$ (인라인) 또는 $$...$$ (블록)으로 입력하세요</p>
                <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}"
                   class="mt-1 text-xs text-red-500"></p>
                <div class="mt-3">
                    <label class="block text-xs font-medium text-gray-500 mb-1">미리보기</label>
                    <div id="contentPreview"
                         class="min-h-12 p-3 bg-gray-50 border border-gray-200 rounded-md text-sm text-gray-700 whitespace-pre-wrap"></div>
                </div>
            </div>

            <!-- 그림/도형 이미지 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">그림/도형 이미지</label>
                <div th:if="${problem != null and problem.imagePath != null}" class="mb-2">
                    <img th:src="@{${problem.imagePath}}" class="max-w-xs border border-gray-200 rounded-md"/>
                    <label class="flex items-center gap-1.5 mt-1 cursor-pointer">
                        <input type="checkbox" th:field="*{removeImage}" class="w-3.5 h-3.5 rounded accent-red-600"/>
                        <span class="text-xs text-red-500">이미지 삭제</span>
                    </label>
                </div>
                <input type="file" th:field="*{image}" accept="image/*"
                       class="w-full text-sm text-gray-600 file:mr-3 file:px-3 file:py-1.5 file:rounded file:border-0 file:bg-gray-100 file:text-gray-700 file:text-sm hover:file:bg-gray-200"/>
                <p class="mt-1 text-xs text-gray-400">도형·그래프 등 LaTeX로 표현하기 어려운 그림은 이미지로 첨부하세요 (5MB 이하)</p>
            </div>

            <!-- 정답 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    정답 <span class="text-red-500">*</span>
                </label>
                <input type="text" th:field="*{answer}"
                       th:class="${#fields.hasErrors('answer')}
                           ? 'w-full px-3 py-2 border border-red-400 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-red-400'
                           : 'w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400'"/>
                <p th:if="${#fields.hasErrors('answer')}" th:errors="*{answer}"
                   class="mt-1 text-xs text-red-500"></p>
            </div>

            <!-- 해설 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">해설</label>
                <textarea th:field="*{explanation}" rows="4"
                          class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400 font-mono"></textarea>
            </div>

            <!-- 태그 선택 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-3">태그 선택</label>
                <div class="space-y-3">
                    <div th:each="entry : ${tagGroups}"
                         class="border border-gray-200 rounded-md p-3">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-semibold text-gray-500"
                                  th:text="${entry.key == 'GRADE'      ? '학년'   :
                                            (entry.key == 'SEMESTER'  ? '학기'   :
                                            (entry.key == 'UNIT'      ? '대단원' :
                                            (entry.key == 'SUB_UNIT'  ? '소단원' :
                                            (entry.key == 'TYPE'      ? '문제유형' : '난이도'))))}">
                            </span>
                            <span th:if="${entry.key == 'UNIT'}"
                                  class="text-xs text-gray-400">(하나만 선택)</span>
                        </div>
                        <div class="flex flex-wrap gap-3">
                            <label th:each="tag : ${entry.value}"
                                   class="flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" name="tagIds" th:value="${tag.id}"
                                       th:attr="data-tag-type=${entry.key}"
                                       th:checked="${selectedTagIds != null and selectedTagIds.contains(tag.id)}"
                                       class="w-3.5 h-3.5 rounded accent-indigo-600"/>
                                <span th:text="${tag.tagValue}" class="text-sm text-gray-700"></span>
                            </label>
                        </div>
                        <p th:if="${entry.key == 'UNIT'}" id="unitWarning"
                           class="hidden mt-2 text-xs text-red-500">
                            대단원은 하나만 선택할 수 있습니다. 이전 선택이 해제되었습니다.
                        </p>
                    </div>
                </div>
            </div>

            <!-- 버튼 -->
            <div class="flex items-center gap-3 pt-2">
                <button type="submit"
                        class="px-5 py-2 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition-colors">
                    저장
                </button>
                <a th:href="@{/problem/list}"
                   class="px-5 py-2 bg-white text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors">
                    취소
                </a>
            </div>
        </form>
    </div>

</div>
<div layout:fragment="scripts">
<script th:inline="none">
document.addEventListener("DOMContentLoaded", function () {
    const textarea = document.getElementById('contentTextarea');
    const preview  = document.getElementById('contentPreview');

    function updatePreview() {
        preview.textContent = textarea.value;
        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(preview, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$",  right: "$",  display: false},
                    {left: "\\[", right: "\\]", display: true},
                    {left: "\\(", right: "\\)", display: false}
                ],
                throwOnError: false
            });
        }
    }

    textarea.addEventListener('input', updatePreview);
    if (textarea.value) { updatePreview(); }

    // 대단원 단일 선택 강제
    const unitCheckboxes = document.querySelectorAll('input[data-tag-type="UNIT"]');
    const unitWarning    = document.getElementById('unitWarning');
    unitCheckboxes.forEach(function (cb) {
        cb.addEventListener('change', function () {
            if (this.checked) {
                let displaced = false;
                unitCheckboxes.forEach(function (other) {
                    if (other !== cb && other.checked) {
                        other.checked = false;
                        displaced = true;
                    }
                });
                if (displaced && unitWarning) {
                    unitWarning.classList.remove('hidden');
                    setTimeout(function () { unitWarning.classList.add('hidden'); }, 3000);
                }
            }
        });
    });
});
</script>
</div>
</body>
</html>
