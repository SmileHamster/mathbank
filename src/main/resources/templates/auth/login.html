<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - MathBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50">

<div class="w-96 bg-white rounded-xl shadow-md p-8">
    <h1 class="text-2xl font-bold text-indigo-700 text-center mb-6">MathBank</h1>

    <!-- 에러 메시지 -->
    <div th:if="${param.error}" class="mb-4 text-sm text-red-600 text-center">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <!-- 로그아웃 메시지 -->
    <div th:if="${param.logout}" class="mb-4 text-sm text-green-600 text-center">
        로그아웃 되었습니다.
    </div>

    <form th:action="@{/auth/login}" method="post">
        <div class="mb-4">
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">아이디</label>
            <input type="text" id="username" name="username"
                   class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                   placeholder="아이디를 입력하세요" required>
        </div>

        <div class="mb-6">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
            <input type="password" id="password" name="password"
                   class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                   placeholder="비밀번호를 입력하세요" required>
        </div>

        <button type="submit"
                class="w-full py-2 px-4 bg-indigo-600 text-white font-medium rounded hover:bg-indigo-700 transition-colors">
            로그인
        </button>
    </form>
</div>

</body>
</html>
