<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>응시 기록 입력 - 시험지 선택</title>
</head>
<body>
<div layout:fragment="content">

    <h1 class="text-xl font-bold text-gray-800 mb-1">응시 기록 입력</h1>
    <p class="text-sm text-gray-500 mb-6">
        <span th:text="${student.name}"></span> 학생이 응시한 시험지를 선택하세요.
    </p>

    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden max-w-2xl">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 text-left text-gray-600 font-medium">시험지명</th>
                    <th class="px-4 py-3 text-left text-gray-600 font-medium w-24">문제 수</th>
                    <th class="px-4 py-3 text-center text-gray-600 font-medium w-24">선택</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(examSheets)}">
                    <td colspan="3" class="px-4 py-12 text-center text-gray-400">
                        생성된 시험지가 없습니다.
                    </td>
                </tr>
                <tr th:each="sheet : ${examSheets}" class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="px-4 py-3 text-gray-800" th:text="${sheet.name}"></td>
                    <td class="px-4 py-3 text-gray-600" th:text="${sheet.totalCount} + '문제'"></td>
                    <td class="px-4 py-3 text-center">
                        <a th:href="@{/attempt/students/{id}/record/{esId}(id=${student.id},esId=${sheet.id})}"
                           class="text-xs px-3 py-1 rounded bg-indigo-600 text-white hover:bg-indigo-700">
                            선택
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
