<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${studentId != null} ? '학생 수정' : '학생 등록'">학생 등록</title>
</head>
<body>
<div layout:fragment="content">

    <div class="max-w-lg">
        <h1 class="text-xl font-bold text-gray-800 mb-6"
            th:text="${studentId != null} ? '학생 수정' : '학생 등록'"></h1>

        <form th:action="${studentId != null} ? @{/attempt/students/{id}/edit(id=${studentId})} : @{/attempt/students/new}"
              th:object="${form}" method="post" class="space-y-6">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    이름 <span class="text-red-500">*</span>
                </label>
                <input type="text" th:field="*{name}"
                       th:class="${#fields.hasErrors('name')}
                           ? 'w-full px-3 py-2 border border-red-400 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-red-400'
                           : 'w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400'"/>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                   class="mt-1 text-xs text-red-500"></p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">학년</label>
                <input type="text" th:field="*{grade}" placeholder="예: 중2"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">메모</label>
                <textarea th:field="*{memo}" rows="3"
                          class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400"></textarea>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button type="submit"
                        class="px-5 py-2 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition-colors">
                    저장
                </button>
                <a th:href="@{/attempt/students}"
                   class="px-5 py-2 bg-white text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors">
                    취소
                </a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
