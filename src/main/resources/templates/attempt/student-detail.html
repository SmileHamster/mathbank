<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${student.name} + ' - 학생 상세'">학생 상세</title>
</head>
<body>
<div layout:fragment="content">

    <div class="flex items-center justify-between mb-4">
        <div>
            <h1 class="text-xl font-bold text-gray-800" th:text="${student.name}"></h1>
            <p class="text-sm text-gray-500 mt-1">
                <span th:if="${student.gradeName}" th:text="${student.gradeName}"></span>
                <span th:if="${student.memo}" th:text="'· ' + ${student.memo}"></span>
            </p>
        </div>
        <div class="flex items-center gap-2">
            <a th:href="@{/attempt/students/{id}/record(id=${student.id})}"
               class="px-4 py-2 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition-colors">
                응시 기록 입력
            </a>
            <a th:href="@{/attempt/students/{id}/edit(id=${student.id})}"
               class="px-4 py-2 bg-white text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors">
                수정
            </a>
        </div>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden mb-6">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 text-left text-gray-600 font-medium">시험지</th>
                    <th class="px-4 py-3 text-left text-gray-600 font-medium w-32">점수</th>
                    <th class="px-4 py-3 text-left text-gray-600 font-medium w-32">응시일</th>
                    <th class="px-4 py-3 text-center text-gray-600 font-medium w-24">관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(summaries)}">
                    <td colspan="4" class="px-4 py-12 text-center text-gray-400">
                        응시 기록이 없습니다.
                    </td>
                </tr>
                <tr th:each="s : ${summaries}" class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="px-4 py-3 text-gray-800" th:text="${s.examSheetName}"></td>
                    <td class="px-4 py-3 text-gray-600"
                        th:text="${s.correctCount} + ' / ' + ${s.totalCount}"></td>
                    <td class="px-4 py-3 text-gray-500"
                        th:text="${#temporals.format(s.submittedAt, 'yyyy-MM-dd')}"></td>
                    <td class="px-4 py-3 text-center">
                        <a th:href="@{/attempt/students/{id}/record/{esId}(id=${student.id},esId=${s.examSheetId})}"
                           class="text-xs px-2 py-1 rounded border border-gray-300 text-gray-600 hover:bg-gray-50">
                            수정
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 통계 -->
    <div th:if="${!#lists.isEmpty(summaries)}">
        <h2 class="text-sm font-semibold text-gray-500 mb-3">성적 통계</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white border border-gray-200 rounded-lg p-4">
                <p class="text-xs font-medium text-gray-500 mb-2">전체 정답률</p>
                <div class="h-52"><canvas id="overallChart"></canvas></div>
            </div>
            <div class="bg-white border border-gray-200 rounded-lg p-4">
                <p class="text-xs font-medium text-gray-500 mb-2">단원별 정답률</p>
                <div class="h-52"><canvas id="unitChart"></canvas></div>
            </div>
            <div class="bg-white border border-gray-200 rounded-lg p-4">
                <p class="text-xs font-medium text-gray-500 mb-2">난이도별 정답률</p>
                <div class="h-52"><canvas id="difficultyChart"></canvas></div>
            </div>
        </div>
    </div>

</div>
<div layout:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function () {
    const summaries         = /*[[${summaries}]]*/ [];
    const unitAccuracy       = /*[[${unitAccuracy}]]*/ [];
    const difficultyAccuracy = /*[[${difficultyAccuracy}]]*/ [];

    if (!summaries.length) return;

    function accuracyRates(list) {
        return list.map(function (a) {
            return a.totalCount ? Math.round(a.correctCount / a.totalCount * 100) : 0;
        });
    }

    const totalCount   = summaries.reduce(function (sum, s) { return sum + s.totalCount; }, 0);
    const correctCount = summaries.reduce(function (sum, s) { return sum + s.correctCount; }, 0);

    new Chart(document.getElementById('overallChart'), {
        type: 'doughnut',
        data: {
            labels: ['정답', '오답'],
            datasets: [{
                data: [correctCount, totalCount - correctCount],
                backgroundColor: ['#4f46e5', '#e5e7eb']
            }]
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
        }
    });

    new Chart(document.getElementById('unitChart'), {
        type: 'bar',
        data: {
            labels: unitAccuracy.map(function (a) { return a.label; }),
            datasets: [{ label: '정답률(%)', data: accuracyRates(unitAccuracy), backgroundColor: '#4f46e5' }]
        },
        options: {
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, max: 100 } },
            plugins: { legend: { display: false } }
        }
    });

    new Chart(document.getElementById('difficultyChart'), {
        type: 'bar',
        data: {
            labels: difficultyAccuracy.map(function (a) { return a.label; }),
            datasets: [{ label: '정답률(%)', data: accuracyRates(difficultyAccuracy), backgroundColor: '#4f46e5' }]
        },
        options: {
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, max: 100 } },
            plugins: { legend: { display: false } }
        }
    });
});
</script>
</div>
</body>
</html>
